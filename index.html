  <style>
:root {

  --surface: #fffaf3;

  --sage: #1c6b56;
  --sage-soft: #e6f3ee;
  --clay: #c46a3a;
  --clay-soft: #f8eadf;

  --shadow: 0 1px 0 rgb(22 36 33 / 0.04), 0 16px 40px rgb(22 36 33 / 0.06);

  color: var(--ink);
  background: var(--bg);
  line-height: 1.55;

* { box-sizing: border-box; }
body { margin: 0; }
button, input { font: inherit; }
button { cursor: pointer; }
button:active:not(:disabled) { scale: 0.98; }
h1, h2 { text-wrap: balance; margin: 0; }
h1 { font-size: 2.4rem; letter-spacing: -0.03em; }
h2 { font-size: 1.35rem; }
p { text-wrap: pretty; }
#app { max-width: 46rem; margin: 0 auto; padding: 1.4rem 1rem 7rem; display: flex; flex-direction: column; gap: 0.9rem; }
.kicker { margin: 0; color: var(--sage); font-size: 0.78rem; font-weight: 600; }
.muted, small { color: var(--muted); }
.lead { font-size: 1.15rem; color: var(--muted); margin: 0; }
.fine { color: var(--muted); font-size: 0.78rem; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
.stats div, .panel, .grid button, .row-btn, .motion, .grades li, .note, input, .card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 1.15rem;
}
.stats div { padding: 0.7rem; }
.stats span, .grid button span, .row-btn small, .motion small { display: block; color: var(--muted); font-size: 0.75rem; }
.stats strong { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.panel { padding: 1.1rem; box-shadow: var(--shadow); }
.plain, .row-btn, .choice, .ghost, .solid, .banner, .text, .back, .chip { border: 0; background: transparent; color: inherit; text-align: start; }

.facts { display: grid; gap: 0.7rem; margin: 0.8rem 0 0; }

.facts dt { color: var(--muted); font-size: 0.75rem; }
.facts dd { margin: 0.15rem 0 0; font-size: 0.92rem; }
.link { color: var(--sage); font-weight: 600; font-size: 0.92rem; }
.grid { display: grid; gap: 0.7rem; }

.grid button, .banner, .row-btn, .choice { min-height: 2.75rem; padding: 0.85rem 1rem; }

.banner { background: var(--clay-soft); border-radius: 1.15rem; }
.banner span { color: var(--muted); font-size: 0.8rem; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 0.7rem; }
input { min-height: 2.75rem; padding: 0 1rem; outline: none; }
input:focus { border-color: var(--sage); }
.chips { display: flex; gap: 0.4rem; overflow-x: auto; padding-bottom: 0.2rem; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 0.45rem 0.8rem; white-space: nowrap; }
.chip.on { background: var(--ink); color: var(--bg); }
.chip.sage { background: var(--sage); color: var(--bg); border-color: var(--sage); }
.list { display: flex; flex-direction: column; gap: 0.45rem; }
.row-btn { display: flex; align-items: center; gap: 0.7rem; width: 100%; border: 1px solid var(--line); border-radius: 1.15rem; }
.row-btn b { width: 2.4rem; height: 2.4rem; display: grid; place-items: center; border-radius: 0.8rem; background: var(--bg); }
.row-btn em { font-style: normal; font-size: 0.75rem; margin-inline-start: auto; }
.back, .text { color: var(--sage); font-weight: 600; min-height: 2.75rem; }
.note { background: var(--clay-soft); border: 0; padding: 0.9rem 1rem; }
.note h2 { color: var(--clay); font-size: 0.95rem; }
.ghost, .solid { border-radius: 999px; min-height: 2.75rem; padding: 0 1rem; font-weight: 600; }
.ghost { border: 1px solid var(--line); background: var(--surface); }
.solid { background: var(--sage); color: var(--bg); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
.card { min-height: 16rem; border-radius: 1.25rem; padding: 1.2rem; display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--shadow); text-align: start; }
.card strong { font-size: 1.45rem; }
.card.back { background: var(--ink); color: var(--bg); }
.card.back span, .card.back small { color: var(--sage-soft); }

.segment button { border-radius: 999px; min-height: 2.6rem; }
.segment button.on { background: var(--ink); color: var(--bg); }
.motion { padding: 0.8rem 1rem; }
.num { color: var(--sage); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.bar { height: 0.4rem; background: var(--bg); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--sage); }

.choices button.bad, .choice.bad, em.bad { border-color: var(--danger); background: var(--danger-soft); color: var(--danger); }

.grades li { display: flex; gap: 0.7rem; padding: 0.75rem 0.9rem; }
.grades b { width: 2.6rem; height: 2.6rem; display: grid; place-items: center; border-radius: 0.8rem; background: var(--sage-soft); color: var(--sage); }
.grades small { display: block; color: var(--muted); }
.ink { background: var(--ink); color: var(--bg); border-radius: 1.15rem; padding: 1rem; }
.ink p { color: var(--sage-soft); }
.score { font-variant-numeric: tabular-nums; }
.score small { font-size: 1.2rem; color: var(--muted); }
.empty { text-align: center; color: var(--muted); }
#nav {

  left: 50%;
  bottom: 0.5rem;
  transform: translateX(-50%);
  display: flex;
  gap: 0.15rem;

  padding: 0.2rem;
  background: var(--surface);
  border: 1px solid var(--line);

button:disabled { opacity: 0.45; }
@media (prefers-reduced-motion: reduce) { button:active { scale: 1; } }

function normalize(value) {
  return value
    .toLowerCase()
    .replace(/[أإآ]/g, "ا")
    .replace(/ى/g, "ي")
    .replace(/ة/g, "ه")
    .replace(/[ً-ْ]/g, "")
    .trim();
}

function shuffle(items, seed) {
  const copy = [...items];
  let state = seed || 1;
  const rand = () => {
    state = (state * 1664525 + 1013904223) % 4294967296;
    return state / 4294967296;
  };
  for (let i = copy.length - 1; i > 0; i -= 1) {
    const j = Math.floor(rand() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

const KEY = "mifsal-html";

function isoDay(date = new Date()) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}
function previousDay(key) {
  const [y, m, d] = key.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  date.setDate(date.getDate() - 1);
  return isoDay(date);
}
function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || "{}");
    return {
      known: raw.known || [],
      bookmarks: raw.bookmarks || [],
      streak: raw.streak || 0,
      lastDay: raw.lastDay || null,
      reviews: raw.reviews || {},
      cases: raw.cases || {},
      quizBest: raw.quizBest || 0,
    };
  } catch {
    return { known: [], bookmarks: [], streak: 0, lastDay: null, reviews: {}, cases: {}, quizBest: 0 };
  }
}
function save() {
  localStorage.setItem(KEY, JSON.stringify(store));
}
function touch() {
  const today = isoDay();
  if (store.lastDay === today) return;
  store.streak = store.lastDay === previousDay(today) ? store.streak + 1 : 1;
  store.lastDay = today;
}
function esc(value) {
  return String(value).replace(/[&<>"']/g, (ch) => {
    const names = { "&": "amp", "<": "lt", ">": "gt", '"': "quot", "'": "#39" };
    return "&" + names[ch] + ";";
  });
}

function onCard(act, id) {
  const deck = cards.filter((card) => ui.topic === "الكل" || card.topic === ui.topic);
  const fresh = deck.filter((card) => !store.known.includes(card.id) && !ui.snoozed.includes(card.id));
  const delayed = deck.filter((card) => !store.known.includes(card.id) && ui.snoozed.includes(card.id));
  const done = fresh.length + delayed.length === 0;
  if (act === "next-card" && done) {
    ui.browse += 1;
    ui.flipped = false;
    return;
  }
  if (!id || done) return;
  if (act === "know") {
    touch();
    if (!store.known.includes(id)) store.known.push(id);
    const today = isoDay();
    store.reviews[today] = (store.reviews[today] || 0) + 1;
    ui.snoozed = ui.snoozed.filter((item) => item !== id);
  }
  if (act === "later") {
    touch();
    const today = isoDay();
    store.reviews[today] = (store.reviews[today] || 0) + 1;
    ui.snoozed = [...ui.snoozed.filter((item) => item !== id), id];
  }
  ui.flipped = false;
  save();
}

function startQuiz() {
  ui.round = shuffle(quizBank, Date.now() % 100000).slice(0, 8);
  ui.step = 0;
  ui.choice = null;
  ui.score = 0;
  ui.finished = false;
  render();
}
function chooseQuiz(index) {
  if (ui.choice !== null) return;
  ui.choice = index;
  if (index === ui.round[ui.step].answer) ui.score += 1;
  render();
}
function nextQuiz() {
  if (ui.step + 1 >= ui.round.length) {
    touch();
    store.quizBest = Math.max(store.quizBest, ui.score);
    save();
    ui.finished = true;
  } else {
    ui.step += 1;
    ui.choice = null;
  }
  render();
}

function dayMuscle() {
  const key = isoDay();
  let hash = 0;
  for (const ch of key) hash = (hash * 33 + ch.charCodeAt(0)) >>> 0;
  return muscles[hash % muscles.length];
}

function optionsFor(end) {
  const pool = [10, 15, 20, 30, 45, 50, 60, 70, 80, 90, 120, 135, 150, 180].filter((value) => value !== end);
  const nearest = [...pool].sort((a, b) => Math.abs(a - end) - Math.abs(b - end)).slice(0, 3);
  return [...nearest, end].sort((a, b) => a - b);
}

    <p class="muted">${esc(muscle.note)}</p>
    <button type="button" class="ghost" data-act="bookmark" data-id="${muscle.id}">${saved ? "محفوظة في الأطلس" : "احفظيها للمراجعة"}</button>
  `;
}

function romHtml() {
  const joints = [...new Set(motions.map((item) => item.joint))];
  const tabs = `
    <div class="segment">
      <button type="button" data-act="rom-tab" data-tab="motion" class="${ui.romTab === "motion" ? "on" : ""}">مدى الحركة</button>
      <button type="button" data-act="rom-tab" data-tab="mmt" class="${ui.romTab === "mmt" ? "on" : ""}">درجات MMT</button>
    </div>`;
  let body = "";
  if (ui.romTab === "mmt") {
    body = `<ol class="grades">${mmtGrades
      .map((grade) => `<li><b>${grade.grade}</b><span><strong>${esc(grade.name)}</strong> <em>${esc(grade.ar)}</em><small>${esc(grade.detail)}</small></span></li>`)
      .join("")}</ol><p class="note">الدرجات + و− تُستخدم بين الأرقام. في الشفوي صِفي الوضع: ضد الجاذبية أم بإلغائها.</p>`;
  } else {
    const rows = motions.filter((item) => item.joint === ui.joint);
    body = `
      <div class="chips">${joints.map((joint) => `<button type="button" data-act="joint" data-joint="${joint}" class="chip ${ui.joint === joint ? "sage" : ""}">${joint}</button>`).join("")}</div>
      <div class="row"><p class="muted">${esc(rows[0].jointEn)}</p><button type="button" class="text" data-act="toggle-rom">${ui.hidden ? "أظهري الأرقام" : "اخفي الأرقام واختبري"}</button></div>
      <div class="list">${rows
        .map((motion) => {
          const choices = ui.hidden
            ? `<div class="choices">${optionsFor(motion.end)
                .map((value) => {
                  const picked = ui.picked[motion.id];
                  const state = picked === undefined ? "" : value === motion.end ? "ok" : picked === value ? "bad" : "";
                  return `<button type="button" data-act="pick-rom" data-motion="${motion.id}" data-value="${value}" class="${state}" ${picked !== undefined ? "disabled" : ""}>0–${value}</button>`;
                })
                .join("")}</div>`
            : "";
          const bar = Math.min(100, Math.round((motion.end / 180) * 100));
          return `<article class="motion"><div class="row"><div><strong>${esc(motion.motion)}</strong><small>${esc(motion.motionEn)}</small></div>${ui.hidden ? "" : `<b class="num">${esc(motion.norm)}</b>`}</div><div class="bar"><i style="width:${bar}%"></i></div>${choices}</article>`;
        })
        .join("")}</div>`;
  }
  return `<p class="kicker">جونيوميتر وقوة</p><h1>المدى والقوة</h1>${tabs}${body}<p class="fine">للمذاكرة فقط. الأرقام تقريبية وفق AAOS.</p>`;
}

function cardsHtml() {
  const deck = cards.filter((card) => ui.topic === "الكل" || card.topic === ui.topic);
  const fresh = deck.filter((card) => !store.known.includes(card.id) && !ui.snoozed.includes(card.id));
  const delayed = deck.filter((card) => !store.known.includes(card.id) && ui.snoozed.includes(card.id));
  const done = fresh.length + delayed.length === 0;
  const card = done ? deck[ui.browse % Math.max(deck.length, 1)] : fresh[0] || delayed[0];
  const knownCount = store.known.filter((id) => deck.some((item) => item.id === id)).length;
  const topics = ["الكل", "عضلة", "اختبار", "عصب", "مدى"]
    .map((topic) => `<button type="button" data-act="topic" data-topic="${topic}" class="chip ${ui.topic === topic ? "on" : ""}">${topic}</button>`)
    .join("");
  if (!card) return `<h1>البطاقات</h1><p class="empty">لا بطاقات.</p>`;
  return `
    <div class="row"><div><p class="kicker">ذاكرة قصيرة</p><h1>البطاقات</h1></div><p class="muted">${knownCount}/${deck.length}</p></div>
    <div class="chips">${topics}</div>
    ${done ? `<p class="note">خلّصتي هذه المجموعة. <button type="button" class="text" data-act="reset-cards">امسحي «عرفتها»</button></p>` : ""}
    <button type="button" class="card ${ui.flipped ? "back" : ""}" data-act="flip">
      ${
        ui.flipped
          ? `<small>الإجابة</small><strong>${esc(card.back)}</strong><span>${esc(card.detail)}</span>`
          : `<small>${esc(card.topic)}</small><strong>${esc(card.front)}</strong><span class="muted">اضغطي لقلب البطاقة</span>`
      }
    </button>
    <div class="pair">
      <button type="button" class="ghost" data-act="later" data-id="${card.id}" ${done ? "disabled" : ""}>أراجعها</button>
      <button type="button" class="solid" data-act="${done ? "next-card" : "know"}" data-id="${card.id}">${done ? "البطاقة التالية" : "عرفتها"}</button>
    </div>
  `;
}

function casesHtml() {
  if (ui.caseId) return caseHtml(ui.caseId);
  const rows = cases
    .map((item, index) => {
      const choice = store.cases[item.id];
      const mark = choice === undefined ? "" : choice === item.answer ? `<em class="ok">صواب</em>` : `<em class="bad">مراجعة</em>`;
      return `<button type="button" class="row-btn" data-act="open-case" data-id="${item.id}"><b>${index + 1}</b><span><strong>${esc(item.title)}</strong><small>${esc(item.tag)}</small></span>${mark}</button>`;
    })
    .join("");
  return `<p class="kicker">شفوي مختصر</p><h1>حالات</h1><p class="muted">اقرئي الصورة ثم اختاري. الإجابة تُحفظ في هذا المتصفح.</p><div class="list">${rows}</div>`;
}

function caseHtml(id) {
  const item = cases.find((entry) => entry.id === id);
  if (!item) return "";
  const choice = store.cases[id];
  const locked = choice !== undefined;
  const options = item.choices
    .map((label, index) => {
      let cls = "";
      if (locked && index === item.answer) cls = "ok";
      else if (locked && choice === index) cls = "bad";
      return `<button type="button" class="choice ${cls}" data-act="answer-case" data-id="${item.id}" data-choice="${index}" ${locked ? "disabled" : ""}>${esc(label)}</button>`;
    })
    .join("");
  const explain = locked
    ? `<section class="ink"><p><strong>${choice === item.answer ? "قراءة صحيحة." : "يعاد النظر."}</strong></p><p>${esc(item.explain)}</p><p><strong>لقطة للعملي. </strong>${esc(item.pearl)}</p></section>`
    : "";
  return `<button type="button" class="back" data-act="back-cases">كل الحالات</button><p class="kicker">${esc(item.tag)}</p><h1>${esc(item.title)}</h1><p>${esc(item.vignette)}</p><h2>${esc(item.question)}</h2><div class="list">${options}</div>${explain}`;
}

function quizHtml() {
  if (!ui.round) {
    return `<p class="kicker">قبل السكشن</p><h1>اختبار من ٨</h1><p class="muted">أفضل نتيجة على هذا المتصفح: <strong>${store.quizBest || "—"}</strong></p><button type="button" class="solid" data-act="start-quiz">ابدئي الجولة</button>`;
  }
  if (ui.finished) {
    const line = ui.score >= 7 ? "مستوى عملي مطمئن." : ui.score >= 4 ? "الأساس موجود. أعيدي البطاقات." : "ارجعي للأطلس ثم أعيدي الجولة.";
    return `<p class="kicker">النتيجة</p><h1 class="score">${ui.score}<small>/8</small></h1><p class="muted">${line}</p><div class="pair"><button type="button" class="solid" data-act="start-quiz">جولة جديدة</button><button type="button" class="ghost" data-act="view" data-view="home">العودة لليوم</button></div>`;
  }
  const item = ui.round[ui.step];
  const options = item.choices
    .map((label, index) => {
      let cls = "";
      if (ui.choice !== null && index === item.answer) cls = "ok";
      else if (ui.choice === index) cls = "bad";
      return `<button type="button" class="choice ${cls}" data-act="choose-quiz" data-choice="${index}" ${ui.choice !== null ? "disabled" : ""}>${esc(label)}</button>`;
    })
    .join("");
  const more = ui.choice !== null ? `<p class="muted">${esc(item.explain)}</p><button type="button" class="solid" data-act="next-quiz">${ui.step + 1 === ui.round.length ? "النتيجة" : "التالي"}</button>` : "";
  const width = ((ui.step + (ui.choice !== null ? 1 : 0)) / ui.round.length) * 100;
  return `<div class="row"><span>${ui.step + 1}/8</span><span>الصحيح ${ui.score}</span></div><div class="bar"><i style="width:${width}%"></i></div><h1>${esc(item.prompt)}</h1><div class="list">${options}</div>${more}`;
}

function render() {
  const pages = { home: homeHtml, atlas: atlasHtml, rom: romHtml, cards: cardsHtml, cases: casesHtml, quiz: quizHtml };
  app.innerHTML = pages[ui.view]();
  renderNav();
}

render();

  </script>
</body>
</html>
